<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 280px;
      background: #1a1d27;
      border-right: 1px solid #2e3248;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      gap: 16px;
    }

    #sidebar h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #a78bfa;
      letter-spacing: 0.5px;
    }

    #sidebar p.hint {
      font-size: 0.78rem;
      color: #6b7280;
      line-height: 1.5;
    }

    #drop-zone {
      border: 2px dashed #3b3f5c;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-size: 0.82rem;
      color: #9ca3af;
    }
    #drop-zone:hover, #drop-zone.dragover {
      border-color: #7c3aed;
      background: #1e1b38;
    }
    #drop-zone svg { margin-bottom: 8px; opacity: 0.6; }

    #file-input { display: none; }

    #file-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
    }
    .file-chip {
      background: #252840;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.75rem;
      color: #c4b5fd;
      display: flex;
      align-items: center;
      gap: 6px;
      word-break: break-all;
    }
    .file-chip svg { flex-shrink: 0; }

    #process-btn {
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #process-btn:hover { background: #6d28d9; }
    #process-btn:disabled { background: #3b3f5c; color: #6b7280; cursor: not-allowed; }

    #status {
      font-size: 0.78rem;
      color: #6b7280;
      text-align: center;
      min-height: 18px;
    }
    #status.success { color: #34d399; }
    #status.error { color: #f87171; }
    #status.loading { color: #fbbf24; }

    /* ── Main chat ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-header {
      padding: 18px 24px;
      border-bottom: 1px solid #2e3248;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #chat-header h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }
    #chat-header span {
      font-size: 0.75rem;
      color: #6b7280;
    }
    #session-badge {
      margin-left: auto;
      background: #1a1d27;
      border: 1px solid #2e3248;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.72rem;
      color: #6b7280;
    }
    #session-badge.active { border-color: #34d399; color: #34d399; }

    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.6;
      word-wrap: break-word;
    }
    .message.user {
      background: #7c3aed;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }
    .message.bot {
      background: #1e2235;
      color: #e0e0e0;
      align-self: flex-start;
      border-bottom-left-radius: 3px;
      border: 1px solid #2e3248;
    }
    .message.typing {
      background: #1e2235;
      border: 1px solid #2e3248;
      align-self: flex-start;
      color: #6b7280;
      font-style: italic;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #374151;
      gap: 12px;
      text-align: center;
    }
    .empty-state svg { opacity: 0.3; }
    .empty-state p { font-size: 0.88rem; }

    #input-row {
      padding: 16px 24px;
      border-top: 1px solid #2e3248;
      display: flex;
      gap: 10px;
    }

    #question-input {
      flex: 1;
      background: #1a1d27;
      border: 1px solid #2e3248;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e0e0e0;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #question-input:focus { border-color: #7c3aed; }
    #question-input:disabled { opacity: 0.4; cursor: not-allowed; }

    #send-btn {
      background: #7c3aed;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
    }
    #send-btn:hover { background: #6d28d9; }
    #send-btn:disabled { background: #3b3f5c; cursor: not-allowed; }
    #send-btn svg { stroke: white; }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <h2>📄 PDF Chatbot</h2>
  <p class="hint">Upload one or more PDFs, process them, then ask anything.</p>

  <div id="drop-zone" onclick="document.getElementById('file-input').click()">
    <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 12V4m0 0L8 8m4-4l4 4"/>
    </svg>
    <div>Drop PDFs here or <u>browse</u></div>
  </div>
  <input type="file" id="file-input" accept=".pdf" multiple />

  <div id="file-list"></div>

  <button id="process-btn" disabled>Process PDFs</button>
  <div id="status">Upload PDFs to get started</div>
</div>

<!-- Main -->
<div id="main">
  <div id="chat-header">
    <svg width="20" height="20" fill="none" stroke="#a78bfa" stroke-width="1.8" viewBox="0 0 24 24">
      <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
    </svg>
    <h1>Ask your PDFs</h1>
    <div id="session-badge">No session</div>
  </div>

  <div id="chat-window">
    <div class="empty-state" id="empty-state">
      <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
        <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 9.414V19a2 2 0 01-2 2z"/>
      </svg>
      <p>Upload and process your PDFs,<br>then ask a question to get started.</p>
    </div>
  </div>

  <div id="input-row">
    <input type="text" id="question-input" placeholder="Ask a question about your documents..." disabled />
    <button id="send-btn" disabled>
      <svg width="18" height="18" fill="none" stroke-width="2" viewBox="0 0 24 24">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
  let sessionId = null;
  let selectedFiles = [];

  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const fileList = document.getElementById('file-list');
  const processBtn = document.getElementById('process-btn');
  const status = document.getElementById('status');
  const chatWindow = document.getElementById('chat-window');
  const emptyState = document.getElementById('empty-state');
  const questionInput = document.getElementById('question-input');
  const sendBtn = document.getElementById('send-btn');
  const sessionBadge = document.getElementById('session-badge');

  // Drag & drop
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    addFiles([...e.dataTransfer.files]);
  });
  fileInput.addEventListener('change', () => addFiles([...fileInput.files]));

  function addFiles(newFiles) {
    newFiles.forEach(f => { if (f.type === 'application/pdf') selectedFiles.push(f); });
    renderFileList();
  }

  function renderFileList() {
    fileList.innerHTML = selectedFiles.map((f, i) => `
      <div class="file-chip">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
        </svg>
        ${f.name}
      </div>`).join('');
    processBtn.disabled = selectedFiles.length === 0;
    if (selectedFiles.length > 0) setStatus(`${selectedFiles.length} file(s) ready`, '');
  }

  function setStatus(msg, type) {
    status.textContent = msg;
    status.className = type;
  }

  processBtn.addEventListener('click', async () => {
    if (!selectedFiles.length) return;
    processBtn.disabled = true;
    setStatus('Processing... this may take a moment ⏳', 'loading');

    const formData = new FormData();
    selectedFiles.forEach(f => formData.append('files', f));

    try {
      const res = await fetch('/upload', { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Upload failed');

      sessionId = data.session_id;
      setStatus(`✓ ${data.message}`, 'success');
      sessionBadge.textContent = 'Session active';
      sessionBadge.classList.add('active');
      questionInput.disabled = false;
      sendBtn.disabled = false;
      questionInput.focus();
    } catch (err) {
      setStatus(`Error: ${err.message}`, 'error');
      processBtn.disabled = false;
    }
  });

  function appendMessage(text, role) {
    if (emptyState) emptyState.remove();
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.textContent = text;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return div;
  }

  async function sendQuestion() {
    const q = questionInput.value.trim();
    if (!q || !sessionId) return;

    questionInput.value = '';
    appendMessage(q, 'user');
    const typing = appendMessage('Thinking...', 'typing');
    questionInput.disabled = true;
    sendBtn.disabled = true;

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, question: q })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Error getting answer');
      typing.remove();
      appendMessage(data.answer, 'bot');
    } catch (err) {
      typing.remove();
      appendMessage(`Error: ${err.message}`, 'bot');
    } finally {
      questionInput.disabled = false;
      sendBtn.disabled = false;
      questionInput.focus();
    }
  }

  sendBtn.addEventListener('click', sendQuestion);
  questionInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendQuestion(); });
</script>
</body>
</html>
